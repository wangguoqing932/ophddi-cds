[project]
name = "ophthalmic_ddi_cds_agent"
version = "0.1.0"
description = "眼科药物相互作用知识库与临床决策支持系统: a rule-based decision support framework for 眼科局部用药与全身系统用药的药物相互作用（DDI）筛查与临床决策支持 screening"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "眼科药物相互作用知识库与临床决策支持系统 Team" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # LLM + LightRAG are REQUIRED (not optional) so that real-mode LightRAG index
    # build works out of the box. PLAN.md §13 assumes this from Phase 3 onwards.
    "openai>=1.0",
    "anthropic>=0.40",
    "lightrag-hku>=1.0",
    "tiktoken>=0.7",
    "transformers>=4.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
streamlit = [
    "streamlit>=1.30",
]
nature = [
    # Bundled deps for the nature-* skill stack (figure / paper / citation / reader).
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "python-pptx>=0.6.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
