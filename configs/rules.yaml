rules:
- id: additive_beta_blockade
  severity: high
  risk_type: pharmacodynamic_cardiovascular
  entity_a_flags:
  - beta_blocker
  - systemic_absorption_high
  entity_b_flags:
  - beta_blocker_systemic
  match: all
  rationale: 'High-absorption topical beta-blockers (e.g., timolol >50% systemic bioavailability)
    plus systemic beta-blockers cause additive beta-adrenergic blockade: bradycardia,
    heart block. Low/medium-absorption agents (betaxolol) handled by moderate_abs_beta_blocker.
    (Khan & Frishman 2024 PMID:39724552; Schuman 2000 PMID:10857839)'
  recommendation: Monitor HR/BP. Use beta1-selective (betaxolol) with punctal occlusion.
  citations:
  - DrugBank:DB00373 https://go.drugbank.com/drugs/DB00373
  evidence_policy:
    output_class: clinical_ddi
    support_tier: direct_clinical
    action_behavior: scoped_clinical_review
    verified_citation_ids:
    - additive_beta_blockade
    claim_scope: 'direct_ophthalmic: high-absorption topical beta-blocker + systemic
      beta-blocker'
    tier: 0A
- id: beta_blocker_ccb_additive
  severity: high
  risk_type: pharmacodynamic_cardiovascular
  entity_a_flags:
  - beta_blocker
  - systemic_absorption_high
  entity_b_flags:
  - l_type_calcium_channel_blocker
  match: all
  rationale: 'High-absorption topical beta-blockers (timolol) with systemic CCBs produce
    additive negative chronotropy/dromotropy: severe bradycardia and AV block reported
    in case series (BMJ 1987: severe bradycardia from timolol eye drops + verapamil
    PMID:3109547; Med J Aust 1983 PMID:6343813). DDInter 2.0 rates timolol-verapamil
    Major.'
  recommendation: Avoid or monitor HR/ECG closely when high-absorption topical beta-blockers
    are used with CCBs (verapamil/diltiazem highest risk).
  citations:
  - BMJ 1987;294:155-a https://doi.org/10.1136/bmj.294.6565.155-a (PMID:3109547)
  - Med J Aust 1983;138:467-8 https://doi.org/10.5694/j.1326-5377.1983.tb136208.x
    (PMID:6343813)
  - 'DDInter 2.0: timolol-verapamil Major'
  evidence_policy:
    output_class: clinical_ddi
    support_tier: direct_clinical
    action_behavior: scoped_clinical_review
    verified_citation_ids:
    - beta_blocker_ccb_bradycardia
    claim_scope: 'direct_ophthalmic: high-absorption topical beta-blocker + systemic
      CCB (case reports)'
    tier: 0A
- id: beta_blocker_digoxin_additive
  severity: high
  risk_type: pharmacodynamic_cardiovascular
  entity_a_flags:
  - beta_blocker
  - systemic_absorption_high
  entity_b_flags:
  - na_k_atpase_inhibitor
  match: all
  rationale: High-absorption topical beta-blockers (timolol) with digoxin cause additive
    AV-node suppression and bradycardia; digoxin is narrow-therapeutic-index so toxicity
    consequences are severe. DDInter 2.0 rates timolol-digoxin Moderate; systemic
    beta-blocker+digoxin additive effects are established (see additive_beta_blockade
    evidence).
  recommendation: Monitor HR/ECG and digoxin levels; educate on bradycardia symptoms.
  citations:
  - 'DDInter 2.0: timolol-digoxin Moderate'
  - Schuman 2000 PMID:10857839 (topical+systemic beta-blocker additive effects)
  evidence_policy:
    output_class: clinical_ddi
    support_tier: direct_clinical
    action_behavior: scoped_clinical_review
    verified_citation_ids:
    - additive_beta_blockade
    claim_scope: 'class_extrapolated (direct_clinical base): high-absorption topical
      beta-blocker + digoxin (NTI) additive AV-node suppression'
    tier: 0A
- id: additive_alpha2_cns_depression
  severity: high
  risk_type: pharmacodynamic_cns
  entity_a_flags:
  - alpha2_agonist
  entity_b_flags:
  - cns_depressant
  rationale: Brimonidine (alpha2-agonist) causes CNS depression. Additive sedation
    with opioids/benzos. Contraindicated <2y. (FDA Label; DrugBank DB00484)
  recommendation: Caution with CNS depressants. Contraindicated in children <2y.
  citations:
  - FDA Label Brimonidine https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/020490s010lbl.pdf
    accessed 2026-07-26
  - DrugBank:DB00484 https://go.drugbank.com/drugs/DB00484
  evidence_policy:
    output_class: precaution
    support_tier: contextual_clinical
    action_behavior: precautionary_review
    verified_citation_ids: []
    claim_scope: 'direct_ophthalmic_for_pediatric_toxicity: '
    tier: 0B
