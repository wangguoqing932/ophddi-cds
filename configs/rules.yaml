    quinidine) significantly increase plasma timolol levels and beta-blockade. DDInter
    Major. (Edeki 1995 JAMA)
  recommendation: 'Contextual precaution: CYP2D6 poor metabolizers at higher risk.
    Monitor for excessive beta-blockade.'
