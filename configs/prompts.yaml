# Exact evaluation prompts — as used in the reported evaluation.
#
# Source of truth: scripts/run_multiseed_per_dataset.py (functions `SYSTEM`,
# `predict_case`, `bm25_ctx`). This file is a transcription of those constants,
# provided so the prompts can be read without running the code. If the two ever
# disagree, the script is authoritative.

schema_version: "1.0"
model: deepseek-chat            # LLM_CHAT_MODEL default; single non-reasoning model
max_tokens: 10                  # 600 when LLM_CHAT_MODEL contains "flash"
parse_rule: >
  Lowercase the raw response; return "high" if it contains "high"; else "medium"
  if it contains "medium" or "moderate"; else "low" if it contains "low";
  otherwise "unknown". Applied identically to all three LLM methods.

system_prompt: |
  You are a clinical pharmacologist assessing ophthalmic drug-drug interaction risk.

  Classify the interaction risk as: low, medium, or high.
  Definitions:
  - low: negligible clinical significance at ophthalmic doses
  - medium: potential interaction requiring monitoring or dose adjustment
  - high: clinically significant interaction; may require avoidance or strict monitoring

  Consider ophthalmic pharmacokinetics (systemic absorption from eye drops is often <10% of oral dose, but some drugs like timolol, atropine, dexamethasone reach >50%).

  Reply with EXACTLY ONE WORD: low, medium, or high. No explanation.

# The three LLM methods share one system prompt (above). They differ only in the
# user message, built as follows. `pair_suffix` is the common suffix for all three.

pair_suffix: |
  Drug pair: ophthalmic {oph} (eye drops) + systemic {sysd} (oral/IV)
  Risk level:

methods:

  pure_llm:
    user_prompt: |
      {pair_suffix}
    description: >
      No retrieved evidence. A single LLM call with the shared system prompt.
    calls_a_model: true

  naive_rag:
    retrieval: bm25
    bm25:
      implementation: rank_bm25.BM25Okapi
      k1: 1.5
      b: 0.75
      top_k: 3
      query_template: "{oph} {sysd} ophthalmic interaction"
      corpus: data/seed/evidence_chunks.jsonl
      corpus_size: 1307
      per_passage_char_cap: 400
      passage_template: "[{doc_id}] {text}"
      empty_corpus_fallback: "No evidence."
    user_prompt: |
      Evidence:
      {retrieved_passages}

      {pair_suffix}
    description: >
      BM25 retrieval over the same 1,307 evidence chunks, top-3 passages truncated
      to 400 characters each, prepended to the pair.
    calls_a_model: true

  lightrag:
    context_source: PreciseKG.full_kg_context
    user_prompt: |
      Drug profiles:
      {kg_context}

      {pair_suffix}
    description: >
      Knowledge-graph context generated by the curated PreciseKG drug-profile
      function, NOT by a query to the LightRAG vector index. The name is retained
      for continuity with earlier protocol versions; Methods Section 2.4 states
      this limitation explicitly.
    calls_a_model: true

  full_system:
    calls_a_model: false
    description: >
      Deterministic three-layer cascade (L1 rules, L2 absorption-scaled class
      matrix, L3 hard constraint). No model call, no network access. Identical
      output at every temperature condition by construction.

temperature_schedule:
  note: >
    Five conditions varying sampling temperature only. These are temperature
    conditions, not seeds: no random seed was varied, and the deterministic
    method is identical across conditions by construction.
  condition_0: 0.0
  condition_1: 0.3
  condition_2: 0.6
  condition_3: 0.9
  condition_4: 1.2
